name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # O Xvfb é o display que o runner não tem: sem ele, todo teste que abre
      # janela Tk morre em "no display name". A FreeSerif é a candidata de Linux
      # em `CHESS_FONT_CANDIDATES` para os símbolos que a DejaVu não desenha. O Tesseract
      # é o motor de prosa, com os dois idiomas do projeto, e o Java é o do epubcheck (PD-27).
      - name: Install system packages
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb fonts-freefont-ttf
          tesseract-ocr tesseract-ocr-eng tesseract-ocr-por default-jre-headless

      # As versões são as do `constraints.txt` — uma versão nova de dependência não chega
      # calada no meio de um push — e o torch vem do índice CPU, sem o CUDA.
      - name: Install project and development tools
        run: >-
          python -m pip install --upgrade pip && python -m pip install
          --extra-index-url https://download.pytorch.org/whl/cpu
          -c constraints.txt -e ".[dev,tools,docx,ocr,ml,epub-validacao]"

      - name: Show the engines the suite will use
        run: |
          tesseract --version && tesseract --list-langs
          java -version
          python -c "import torch, fitz; print('torch', torch.__version__, 'pymupdf', fitz.VersionBind)"

      - name: Compile Python modules
        run: python -m compileall -q appy.py core ui config scripts

      - name: Lint
        run: python -m ruff check core ui appy.py config scripts tests

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Check packaged resources
        shell: bash
        run: python scripts/verificar_empacotamento.py --wheel dist/*.whl

      # Os testes de janela (`gui`) rodam aqui também, sob o Xvfb (PD-27).
      - name: Run deterministic tests
        run: xvfb-run -a python -m pytest -q -m "not slow"

      # As medições de desempenho (`slow`) rodam num processo só delas, como no gate de
      # docs/OPERATIONS.md: o teto de memória do AC-005 é o do editor, e no processo da suíte
      # inteira o RSS medido era o que os quase três mil testes anteriores tinham carregado.
      - name: Run performance measurements
        run: xvfb-run -a python -m pytest -q -m "slow and not gui"

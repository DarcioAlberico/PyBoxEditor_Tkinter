[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyboxeditor"
version = "0.1.0"
description = "Editor e pipeline de OCR para livros e diagramas de xadrez"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "core", "core.dados", "core.services", "core.editor", "core.biblioteca", "config", "ui", "ui.editor",
    "assets", "assets.fonts", "assets.lexico",
]

[tool.setuptools.package-data]
core = ["dados/*.pth", "dados/*.json"]
"assets.fonts" = ["*.ttf", "*.txt"]
"assets.lexico" = ["*.gz"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8,<5",
       "wordfreq>=3.1", "rapidfuzz>=3.0"]
ml = ["torch>=2.0", "easyocr>=1.7"]
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "build>=1.2"]
tools = ["fonttools>=4.50"]
# O editor de livros (ED-08): a validação com o epubcheck (precisa de Java) e, opcional, um
# navegador embutido para a prévia — a prévia própria (TextoRico) não depende dele.
epub-validacao = ["epubcheck>=5.0"]
editor-previa = ["tkinterweb>=3.24"]
all = [
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8,<5",
    "wordfreq>=3.1",
    "rapidfuzz>=3.0",
    "torch>=2.0",
    "easyocr>=1.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "fonttools>=4.50",
]
desktop = [
    "pyinstaller>=6.0,<7",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "training_data", "training_data_*", "Diagramas-outro-projeto"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, `l` é "linha" (`for l in linhas`), a grafia da casa: o E741 só pega isso lá.
"tests/**" = ["E501", "E741"]
# As medições de uma fase (scripts/medidas/) não são produto: só as regras de erro valem lá.
"scripts/medidas/**" = ["E741", "E702", "E731"]

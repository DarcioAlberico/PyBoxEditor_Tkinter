[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyboxeditor"
version = "0.1.0"
description = "Editor e pipeline de OCR para livros e diagramas de xadrez"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "core", "core.dados", "core.services", "core.editor", "config", "ui", "ui.editor",
    "assets", "assets.fonts", "assets.lexico",
]

[tool.setuptools.package-data]
core = ["dados/*.pth", "dados/*.json"]
"assets.fonts" = ["*.ttf", "*.txt"]
"assets.lexico" = ["*.gz"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8,<5",
       "wordfreq>=3.1", "rapidfuzz>=3.0"]
ml = ["torch>=2.0", "easyocr>=1.7"]
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]
tools = ["fonttools>=4.50"]
all = [
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8,<5",
    "wordfreq>=3.1",
    "rapidfuzz>=3.0",
    "torch>=2.0",
    "easyocr>=1.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "fonttools>=4.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: testes sem arquivos externos ou GUI",
    "integration: testes envolvendo múltiplos componentes",
    "gui: testes que exigem display Tkinter",
    "ml: testes que exigem PyTorch ou modelos neurais",
    "export: testes de exportação DOCX/EPUB/PDF",
    "slow: medições de desempenho do editor, fora do gate padrão (-m 'not slow')",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "training_data", "training_data_*", "Diagramas-outro-projeto"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[pytest]
# Sem isto, `pytest` na raiz varre o projeto inteiro. Custava 67 segundos só de
# coleta (contra 25 de execução em tests/), e recolhia `test_draw.py::test_font`
# — um script manual, não um teste: o pytest lia `font_name` e `output_name`
# como fixtures e a coleta quebrava. Os scripts saíram na F5.4, e o testpaths
# impede que a próxima raiz chamada `test_*.py` refaça o estrago.
testpaths = tests
# Este arquivo faz o pytest ignorar o [tool.pytest.ini_options] do pyproject.toml,
# inclusive os marcadores registrados lá (ED-00): eles moram aqui, e `-m "not slow"`
# é o gate padrão.
markers =
    unit: testes sem arquivos externos ou GUI
    integration: testes envolvendo múltiplos componentes
    gui: testes que exigem display Tkinter
    ml: testes que exigem PyTorch ou modelos neurais
    export: testes de exportação DOCX/EPUB/PDF
    slow: medições de desempenho do editor, fora do gate padrão (-m "not slow")
